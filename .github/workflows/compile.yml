name: Compile GooseDroid

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      # Usamos la acción nativa sin forzar versiones de texto inválidas que causen error 404
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools;build-tools;34.0.0;platforms;android-34'

      # Forzamos la aceptación de licencias mediante la terminal de Linux de manera nativa
      - name: Accept Android Licenses Automatically
        run: |
          yes | sdkmanager --licenses || true

      - name: Grant Execute Permission for Gradle
        run: chmod +x gradlew

      - name: Build APK (Debug)
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GooseDroid-Debug-APK
          path: build/outputs/apk/debug/*.apk
