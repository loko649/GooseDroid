name: Compile APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Fix Missing Local Properties and CompileSDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "android.compileSdk=34" >> gradle.properties

      - name: Create Fake Keystore for Release
        run: |
          mkdir -p app/
          keytool -genkey -v -keystore app/debug.keystore -alias androiddebugkey -keypass android -storepass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Grant Execute Permission for Gradlew
        run: chmod +x ./gradlew

      - name: Build APK with Gradle
        run: ./gradlew assembleDebug --no-daemon -PcompileSdk=34
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m"

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: GooseDroid-Debug-APK
          path: app/build/outputs/apk/debug/*.apk


  
